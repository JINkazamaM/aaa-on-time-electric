    <!-- Critical CSS - Inline to prevent theme flash -->
    <style>
      /* Critical above-the-fold styles */
      :root {
        --primary: #06b6d4;
        --secondary: #0891b2;
        --accent: #22d3ee;
        --bg-base: #083344;
        --bg-surface: #164e63;
        --bg-card: rgba(21, 94, 117, 0.4);
        --text-base: #f1f5f9;
        --text-muted: #94a3b8;
        --border-accent: rgba(21, 94, 117, 0.5);
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 130px;
        height: 100%;
      }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-base);
        color: var(--text-base);
        min-height: 100vh;
        min-height: 100dvh; /* Dynamic viewport height for mobile */
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Loading state */
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(6, 182, 212, 0.3);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Prevent FOUC (Flash of Unstyled Content) */
      .no-fouc {
        visibility: hidden;
      }

      /* Critical button styles */
      .btn-primary {
        background-color: var(--primary);
        color: var(--bg-base);
        font-weight: 700;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        border: none;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
        transition: background-color 0.2s ease;
      }

      .btn-primary:hover {
        background-color: var(--accent);
      }

      /* Emergency banner critical styles */
      .emergency-banner {
        background: linear-gradient(to right, #dc2626, #b91c1c, #dc2626);
        color: white;
        padding: 0.5rem 1.5rem;
        text-align: center;
        font-weight: 700;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid rgba(0,0,0,0.2);
      }

      /* Safe area for mobile */
      @supports (padding: max(0px)) {
        .safe-area-pb {
          padding-bottom: max(env(safe-area-inset-bottom), 0px);
        }
      }
    </style>

    <!-- Theme initialization script - runs before React loads -->
    <script>
      (function() {
        try {
          // Prevent theme flash by setting theme before React loads
          const savedTheme = localStorage.getItem('aaa_theme-preference');
          if (savedTheme) {
            try {
              const theme = JSON.parse(savedTheme).data;
              if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
              }
            } catch (e) {
              // Invalid stored theme, use system preference
              const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              if (!prefersDark) {
                document.documentElement.setAttribute('data-theme', 'light-clean');
              }
            }
          } else {
            // Check system preference
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (!prefersDark) {
              document.documentElement.setAttribute('data-theme', 'light-clean');
            }
          }
        } catch (e) {
          // localStorage not available (private browsing, etc.)
          console.warn('Theme initialization failed:', e);
        }
      })();
    </script>
